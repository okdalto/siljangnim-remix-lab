<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KD-tree · 공간을 나누는 네 가지 방법</title><style>*{box-sizing:border-box}body{margin:0;background:#111714;color:#e5eee6;font:15px system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:30px;margin:4px 0 24px;letter-spacing:-1px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,select{font:inherit;color:inherit;background:#26352c;border:1px solid #45574b;border-radius:7px;padding:10px 15px;cursor:pointer}button.active{background:#c5ec98;color:#172719;border-color:#c5ec98}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}aside{background:#1b251f;padding:22px;border-radius:12px}h2{font-size:20px;margin-top:0}p{color:#b6c5b9;line-height:1.75}label{display:block;margin:20px 0 8px}input[type=range]{width:100%;accent-color:#c5ec98}#stage{height:660px;position:relative;background:#151f19;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#gl{position:absolute;inset:0}#note{position:absolute;left:18px;bottom:16px;pointer-events:none;font-size:13px;color:#b5c7b9}#stats{font-size:13px;font-variant-numeric:tabular-nums;color:#d3e6be}footer{font-size:12px;color:#879c8c;margin:18px 0}a{color:inherit}.row{display:flex;gap:6px;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:800px){main{padding:16px}.layout{grid-template-columns:1fr}#stage{height:500px;order:0}aside{padding:16px;order:1}h1{font-size:24px}}</style>
<main><h1>KD-tree, 공간을 나누면 무엇이 될까?</h1><nav><button data-tab="0" class="active">01 · 나누고 찾기</button><button data-tab="1">02 · Noise를 패턴으로</button><button data-tab="2">03 · x · y · z 공간</button><button data-tab="3">04 · 세 가지 조각</button></nav><div class="layout"><aside><h2 id="title"></h2><p id="desc"></p><label>분할 깊이 <b id="depthValue"></b></label><input id="depth" aria-label="분할 깊이" type="range" min="0" max="10" value="4"><div class="row"><button id="step">한 단계 분할</button><button id="animate">분할 재생</button></div><div id="noiseControls" hidden><label>Noise 크기 <b id="scaleValue">1.8</b></label><input id="scale" aria-label="Noise 크기" type="range" min="7" max="40" value="18"><button id="seed">다른 패턴</button></div><div id="volumeControls" hidden><label>앞쪽을 잘라 내부 보기 <b id="cutValue">0%</b></label><input id="cut" aria-label="단면 깊이" type="range" min="0" max="95" value="0"><label>남기는 Noise 범위 <b id="bandValue">0.24</b></label><input id="band" aria-label="남기는 Noise 범위" type="range" min="8" max="75" value="24"><label><input type="checkbox" id="all"> 빈 공간도 모두 보기</label><button id="reset">시점 초기화</button></div><div id="styleControls" hidden><label>같은 공간, 다른 재료</label><div class="row"><button data-style="blocks" class="active">덩어리</button><button data-style="plates">판</button><button data-style="edges">모서리</button></div></div><p id="stats"></p></aside><section id="stage"><canvas id="flat" aria-label="KD-tree 분할 및 Noise 비교"></canvas><div id="gl" hidden></div><div id="note"></div></section></div><footer>직접 구현한 median KD-tree (2D: x→y, 3D: x→y→z) × <a href="https://github.com/jwagner/simplex-noise.js">simplex-noise.js 4.0.3</a> × Three.js. 3D는 부피 전체를 분할합니다. 사진·높이 맵을 사용하지 않습니다.</footer></main><script type="module" src="app.mjs"></script></html>
